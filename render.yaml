# Render Blueprint: the backend API as a free Docker web service.
# Render dashboard -> New -> Blueprint -> pick this repository. See docs/08-deployment.md.
# The database is NOT on Render (its free Postgres expires); use Neon and paste its URL
# into DATABASE_URL when Render asks.
services:
  - type: web
    name: innovprocure-api
    runtime: docker
    plan: free
    region: singapore
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      # Neon DIRECT connection string (in Neon's Connect dialog turn OFF "Connection pooling":
      # the host must NOT contain -pooler), changed to the SQLAlchemy form, e.g.
      # postgresql+psycopg://neondb_owner:PASSWORD@ep-xxxx.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      - key: DATABASE_URL
        sync: false
      # Random secret generated by Render (signs login tokens; at least 32 characters).
      - key: JWT_SECRET
        generateValue: true
      # Public demo: nobody can self-register; accounts are created by the team.
      - key: AUTH_PUBLIC_REGISTRATION
        value: "false"
      - key: EMBEDDINGS_ENABLED
        value: "false"
      - key: LLM_PROVIDER
        value: mock
      # Neon may need a moment to wake up from auto-suspend.
      - key: DB_CONNECT_TIMEOUT_SECONDS
        value: "15"
