# Career steps (the role ladder). Training hours are demo assumptions (length of the
# matching demo short course), not official figures; null = a full programme (the
# Electrician ITI trade takes two years), not modelled in hours.
career_steps:
  - {from: wireman, to: electrician, type: PROMOTION, training_hours: null, note: Complete the Electrician trade (a two-year ITI programme).}
  - {from: electrician, to: ev-service-technician, type: PROMOTION, training_hours: 240, note: "Add EV diagnostics, battery and HV safety training."}
  - {from: electrician, to: ev-charging-installer, type: LATERAL, training_hours: 130, note: Add EV charger installation training.}
  - {from: motor-rewinder, to: electrician, type: LATERAL, training_hours: null, note: Move from a declining trade to general electrical work (Electrician trade).}
  - {from: solar-pv-installer, to: solar-service-technician, type: PROMOTION, training_hours: 120, note: Add inverter servicing and testing.}

