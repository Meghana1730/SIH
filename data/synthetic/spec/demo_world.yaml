outcomes:
  related_to_training_share: 0.85   # placed in the course's own role
  retention_6m: 0.75                # still employed after 6 months (when known)
  employer_link_share: 0.5          # wage jobs at one of the demo employers
  rating_mean: {default: 3.6, demo-ev-technician: 4.4, demo-ev-charging: 4.2, demo-wireman: 3.1}

