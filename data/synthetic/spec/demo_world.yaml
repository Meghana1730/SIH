postings:
  # Share of ads posted by one of the demo employers above (same district, a role they
  # survey for); the rest come from a pool of fictional small employers.
  directory_employer_share: 0.3
  # A demo employer posts at most ceil(the headcount it asks for / 4) + this many ads a
  # quarter (so a small workshop never "posts" dozens of ads).
  directory_ads_slack: 1
  employer_pool_size: 25
  employer_pool_names:
    ELECTRICAL: Example Electrical Contractor
    EV: Example EV Garage
    SOLAR_PV: Example Solar Installer
  salary_stated_share: 0.7
  text:
    en: "Hiring: {title} at {employer}, {location}. Skills required: {skills}. Experience: {experience}."
    hi: "आवश्यकता: {title}, {employer}, {location}। आवश्यक कौशल: {skills}। अनुभव: {experience}।"
    mr: "पाहिजे: {title}, {employer}, {location}. आवश्यक कौशल्ये: {skills}. अनुभव: {experience}."
  experience_text:
    en: "{low}-{high} years"
    hi: "{low}-{high} वर्ष"
    mr: "{low}-{high} वर्षे"
  # Appended to the ad text when the ad states a salary.
  salary_text:
    en: "Salary: Rs {low}-{high} per month."
    hi: "वेतन: ₹{low}-{high} प्रति माह।"
    mr: "पगार: ₹{low}-{high} दरमहा."
  hardest_skills_text:
    en: "Hard to find: {skills}."
