# -----------------------------------------------------------------------------
# Demo courses: SIMPLIFIED DEMO SYLLABI (a few modules each), not official DGT/NSQF
# syllabi. `skills` = skill -> band taught (1 assist .. 4 lead).
# ITI trades are annual programmes of `programme_years` years; their total hours are not
# modelled (duration_hours null), and module hours are the demo modules only.
# primary_role = the job the course trains for (training supply is counted for it);
# secondary_roles = other jobs graduates commonly move into (used for skill coverage).
# -----------------------------------------------------------------------------
courses:
  # PP2: the golden-path course. Teaches none of EV Diagnostics, Battery Management or
  # EV Charging Systems.
  - code: demo-electrician
    name: Electrician (demo syllabus)
    type: ITI_TRADE
    sector: ELECTRICAL
    primary_role: electrician
    secondary_roles: [ev-service-technician]
    syllabus_version: demo-v1 (not official)
    delivery: annual
    programme_years: 2
    duration_hours: null
    trainers_per_offering: 2
    trainer_certifications: [Instructor training certificate (demo record)]
    placement_types: {WAGE: 0.8, SELF_EMPLOYED: 0.1, APPRENTICESHIP: 0.1}
    modules:
      - {title: Electrical Wiring, hours: 120, skills: {electrical-wiring: 3, earthing: 2, electrical-testing: 1, cable-installation: 1}}
