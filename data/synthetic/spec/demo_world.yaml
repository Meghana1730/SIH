# =============================================================================
# KaushalSetu demo world: the hand-written description the synthetic generator expands
# =============================================================================
# EVERYTHING IN THIS FILE IS SYNTHETIC. Institutes and employers are fictional ("Example
# ..."), all numbers are TEAM ASSUMPTIONS chosen to plant the patterns in
# config/synthetic.yaml (PP1-PP7). None of it is an official statistic, a real company, a
# real syllabus or a government code. Official codes are never set.
#
# The generator (backend/app/synthetic/) turns this file + the seed in config/synthetic.yaml
# into CSV files under data/synthetic/export/:
#
#   python -m app.cli.synthetic generate     # write the CSV/JSON export
#   python -m app.cli.synthetic load         # import it into the database
#   python -m app.cli.synthetic validate     # prove the planted patterns are in the data
#
# The COUNTS below (postings per quarter, seats, completion/placement rates, survey
# headcounts) decide the patterns, so the patterns hold for every seed. The seed only
# decides incidental details: dates inside a quarter, job titles, employers of postings,
# salaries, which trainee is placed.
#
# Quarter lists always cover config/synthetic.yaml history: 2025Q2, 2025Q3, 2025Q4,
# 2026Q1, 2026Q2, 2026Q3 (6 values). Validate with: python -m app.cli.synthetic check-spec
# =============================================================================

# Data cut-off: nothing in the dataset is dated after this day (inside the last quarter).
as_of: "2026-09-28"
# Written into every row's fetched_at, so the export is identical on every run.
generated_at: "2026-09-28T12:00:00+05:30"
license_note: >-
  SYNTHETIC demo data (KaushalSetu SIH prototype): fictional entities, team-assumed
  numbers, not real or official statistics.

