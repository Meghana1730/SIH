cases:
  # ---- exact: same as the canonical name after normalisation (case, spaces, punctuation)
  - {input: "EV Diagnostics", expected: ev-diagnostics, category: exact}
  - {input: "pLc programming", expected: plc-programming, category: exact}
  - {input: "  Domestic   Wiring ", expected: domestic-wiring, category: exact}
  - {input: "High Voltage Safety", expected: hv-safety, category: exact}
  - {input: "Motor Rewinding.", expected: motor-rewinding, category: exact}

  # ---- alias: a curated alternative name (English, Hindi, Marathi)
  - {input: "HV safety", expected: hv-safety, category: alias}
  - {input: "House Wiring", expected: domestic-wiring, category: alias}
  - {input: "EV charging station installation", expected: ev-charger-installation, category: alias}
  - {input: "सोलर पैनल लगाना", expected: rooftop-solar-installation, category: alias}
  - {input: "lockout/tagout", expected: electrical-safety, category: alias}
  - {input: "programmable logic controller programming", expected: plc-programming, category: alias}

  # ---- spelling: typos and spelling variants
  - {input: "EV diagnostcs", expected: ev-diagnostics, category: spelling}
  - {input: "Domestic Wirring", expected: domestic-wiring, category: spelling}
  - {input: "Multimetre Measurement", expected: multimeter-measurement, category: spelling}
  - {input: "rooftop solar PV instalation", expected: rooftop-solar-installation, category: spelling}
  - {input: "PLC programing", expected: plc-programming, category: spelling}
  - {input: "high-voltage safty", expected: hv-safety, category: spelling}
  - {input: "Motor rewindng", expected: motor-rewinding, category: spelling}
  - {input: "Transformer Maintainance", expected: transformer-maintenance, category: spelling}

  # ---- semantic: different words, same meaning (the hard part; not expected to be perfect)
  - {input: "EV troubleshooting", expected: ev-diagnostics, category: semantic}
  - {input: "electric vehicle diagnostics", expected: ev-diagnostics, category: semantic}
  - {input: "EV diagnostic", expected: ev-diagnostics, category: semantic}
  - {input: "diagnosing electric vehicle faults", expected: ev-diagnostics, category: semantic}
  - {input: "installing EV chargers", expected: ev-charger-installation, category: semantic}
