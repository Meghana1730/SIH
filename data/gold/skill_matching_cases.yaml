# =============================================================================
# Skill-matching evaluation set (hand-made, for testing the matcher only)
# =============================================================================
# `vocabulary` is a SMALL, SYNTHETIC skill list written by the team for this test. It is
# not the real Skill Graph and not official NOS wording.
# `cases` are phrases with the skill they SHOULD match (`expected: null` = should match
# nothing). Categories: exact, alias, spelling, semantic, unrelated.
# Used by:  pytest tests/test_skill_matching.py   and   python -m app.cli.eval_skill_matching
# =============================================================================

vocabulary:
