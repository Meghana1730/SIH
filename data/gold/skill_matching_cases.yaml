  - {input: "wiring of homes", expected: domestic-wiring, category: semantic}
  - {input: "repairing solar inverters", expected: solar-inverter-maintenance, category: semantic}
  - {input: "rewinding electric motors", expected: motor-rewinding, category: semantic}
  - {input: "explaining faults to customers", expected: customer-communication, category: semantic}
  # cross-language (Hindi / Marathi phrase, English skill name)
  - {input: "इलेक्ट्रिक वाहन की खराबी जांचना", expected: ev-diagnostics, category: semantic}
  - {input: "घर की वायरिंग", expected: domestic-wiring, category: semantic}
  - {input: "सौर पॅनेल बसवणे", expected: rooftop-solar-installation, category: semantic}

  # ---- unrelated: should match NOTHING (some are deliberately close, e.g. Java vs PLC programming)
