# =============================================================================
# Job-posting pipeline evaluation set (hand-written prototype examples)
# =============================================================================
# 52 short job ads WRITTEN BY THE TEAM for testing (not real ads, not real employers), with
# the skills each ad clearly asks for and the role it is for. Labels use the synthetic demo
# vocabulary (source Y13: 18 skills, 7 roles; data/synthetic/spec/demo_world.yaml) because
# the curated Skill Graph does not exist yet.
#
# Honesty notes:
# * The same team wrote the aliases and these ads, so alias-based examples are easier than
#   real ads will be. The "semantic", "spelling", Hindi/Marathi and "unknown" examples
#   deliberately use wording that is NOT in the vocabulary.
# * expected_skills  = skills the ad clearly asks for (name, alias, misspelling or clear
#                      paraphrase). optional_skills = reasonable to find, not required.
# * expected_role    = the role the ad is for (null = none of our roles);
#   acceptable_roles = other roles that are also defensible for an ambiguous ad.
#
# Run:  python -m app.cli.jobs evaluate        (report: docs/06-job-intelligence.md)
# =============================================================================

