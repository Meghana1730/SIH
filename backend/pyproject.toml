[project]
name = "kaushalsetu-backend"
version = "0.1.0"
description = "KaushalSetu API: labour-market intelligence and curriculum alignment (SIH prototype)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "psycopg[binary]>=3.2",
  "pgvector>=0.5",  # vector column type for SQLAlchemy (skill embeddings)
  "pyyaml>=6.0",    # reads config/*.yaml
  "pyjwt>=2.8",     # signed login tokens (JWT)
  "argon2-cffi>=23.1",  # password hashing (argon2id)
  "rapidfuzz>=3.9", # fuzzy (spelling) matching of skill names
]

[project.optional-dependencies]
# Semantic skill matching (large: pulls in PyTorch). Optional: without it the matcher uses
# exact/alias/fuzzy matching only.  pip install -e ".[embeddings]"
embeddings = [
  "sentence-transformers>=3.0",
]
dev = [
  "pytest>=8.0",
  "httpx2>=2.13",  # HTTP client used by FastAPI/Starlette's TestClient
  "ruff>=0.5",
  "black>=24.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"   # print the reason for every skipped test
markers = [
  "db: needs the PostgreSQL container running (docker compose up -d db) and migrations applied",
  "embeddings: needs sentence-transformers and the downloaded model (skipped otherwise)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Generated migrations contain long SQL strings (CHECK constraints) that cannot be wrapped.
"alembic/versions/*" = ["E501"]

[tool.ruff.lint.isort]
# Our backend/alembic/ folder has the same name as the alembic package; tell isort which is which.
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.black]
line-length = 100
target-version = ["py311"]
